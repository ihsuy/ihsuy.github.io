<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yushi Chonan</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into a query string
      // so the browser follows the redirect and the app can restore it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        l.hash
      );
    </script>
  </head>
</html>
